name: Build System Optimizer

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: SystemOptimizer

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build (Release)
        run: dotnet build -c Release --no-restore

      - name: Publish single-file exe
        run: >
          dotnet publish src/SystemOptimizer/SystemOptimizer.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

      - name: Upload executable (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: SystemOptimizer-win-x64
          path: SystemOptimizer/publish/SystemOptimizer.exe
          if-no-files-found: error

      # Publish a real Release with the exe attached so it has a permanent,
      # mobile-friendly download link (no login / unzip needed, unlike
      # artifacts). The runner's token creates the tag + release directly.
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: so-latest
          name: System Optimizer (latest)
          files: SystemOptimizer/publish/SystemOptimizer.exe
          prerelease: true
          body: |
            Latest automated build of System Optimizer (Windows, self-contained).

            **Download `SystemOptimizer.exe` below.** No install needed.
            On first launch, approve the UAC prompt and, if SmartScreen warns,
            choose "More info → Run anyway" (the build is unsigned).
